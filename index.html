      default-src 'self';
      script-src 'self';
      style-src 'self' 'unsafe-inline';
      font-src 'self';
      img-src 'self' data:;
      connect-src 'self';
      form-action 'none';
      base-uri 'none';
      object-src 'none';
      frame-src 'none'" />
